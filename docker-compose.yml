services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: custent
      POSTGRES_USER: custent
      POSTGRES_PASSWORD: custent
    ports:
      - "127.0.0.1:${CUSTENT_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U custent -d custent"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - custent-postgres:/var/lib/postgresql/data

volumes:
  custent-postgres:
