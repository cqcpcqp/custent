name: Deploy Custent

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: custent
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: custent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U custent -d custent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://custent:ci-only-password@localhost:5432/custent_test
      TEST_DATABASE_URL: postgres://custent:ci-only-password@localhost:5432/custent_test
      OPENAI_API_KEY: ci-placeholder-not-a-real-key
      OPENAI_BASE_URL: http://127.0.0.1:9/v1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - run: npm install --global pnpm@11.9.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec next typegen
      - run: pnpm db:migrate
      - run: pnpm check
      - run: bash -n deploy/deploy.sh

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        id: build
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/cqcpcqp/custent:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/cqcpcqp/custent
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "image=ghcr.io/cqcpcqp/custent@$DIGEST" >> "$GITHUB_OUTPUT"

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: custent-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_IMAGE: ${{ needs.publish.outputs.image }}
      GHCR_USER: ${{ github.actor }}
      RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Ignore superseded commits
        id: current
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          latest_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [[ "$latest_sha" == "$GITHUB_SHA" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping superseded commit $GITHUB_SHA"
          fi
      - name: Configure SSH
        if: steps.current.outputs.deploy == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_PORT"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/custent-deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/custent-deploy ~/.ssh/known_hosts
      - name: Deploy immutable image
        if: steps.current.outputs.deploy == 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ssh_options=(-i ~/.ssh/custent-deploy -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          destination="$DEPLOY_USER@$DEPLOY_HOST"
          remote_release="/opt/custent/releases/$RELEASE_ID"
          tar -C deploy -czf - . | ssh "${ssh_options[@]}" "$destination" "umask 077; mkdir -p '$remote_release'; tar -xzf - -C '$remote_release'"
          printf '%s' "$GHCR_TOKEN" | ssh "${ssh_options[@]}" "$destination" "sudo -n bash '$remote_release/deploy.sh' '$DEPLOY_IMAGE' '$GHCR_USER'"
      - name: Remove SSH credentials
        if: always()
        run: rm -f ~/.ssh/custent-deploy ~/.ssh/known_hosts
